name: Check WARDOGS player stats API
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect Steam stat definitions
        env:
          STEAM_WEB_API_KEY: ${{ secrets.STEAM_WEB_API_KEY }}
        run: python scripts/check-player-stats.py
      - uses: actions/upload-artifact@v4
        with:
          name: wardogs-steam-schema
          path: steam-schema.json
          if-no-files-found: error
